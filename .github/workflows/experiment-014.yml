name: Experiment 014 edge-set vs delta assignment

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/experiment_014_edge_set_vs_assignment.py'
      - 'tests/test_experiment_014.py'
      - '.github/workflows/experiment-014.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment-014:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Preflight runtime, data, protocol constants, and artifact contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: |
          python - <<'PY'
          import numpy, scipy, persona_net
          import experiment_014_edge_set_vs_assignment as e
          from pathlib import Path
          from persona_net.v04_data import load_v04_split
          root=Path.cwd()/"data"/"v0_4"
          actual={s:len(load_v04_split(root,s)) for s in ("train","validation","adversarial")}
          assert actual=={"train":100,"validation":40,"adversarial":20}, actual
          assert e.SEEDS==(1842,101,202,303,404,505)
          assert e.CYCLIC_PAIRS==((1842,101),(101,202),(202,303),(303,404),(404,505),(505,1842))
          assert e.CORE_FRACTION==0.01
          assert e.RANDOMIZATION_NAMESPACE=="experiment014-v1-preregistered"
          expected=Path("results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.json")
          assert expected.name=="report_n1024_steps24000.json"
          print("preflight ok",actual,"numpy",numpy.__version__,"scipy",scipy.__version__)
          PY
      - name: Unit and protocol preflights
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python -m pytest -q tests/test_experiment_013_alignment.py tests/test_experiment_013_stage_c.py tests/test_experiment_013_stage_d.py tests/test_experiment_014.py
      - name: Run preregistered Experiment 014
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/experiment_014_edge_set_vs_assignment.py --neurons 1024 --training-neural-steps 24000
      - name: Verify report and record file SHA-256
        if: always()
        run: |
          test -f results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.json
          sha256sum results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.json | tee results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.sha256
      - name: Upload immutable Experiment 014 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-014-${{ github.sha }}
          path: |
            results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.json
            results/experiment_014_edge_set_vs_assignment/report_n1024_steps24000.sha256
          if-no-files-found: error
          retention-days: 90
