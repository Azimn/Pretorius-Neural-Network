name: BioCircuit BC00 executable prototype

on:
  pull_request:
    paths:
      - 'biocircuit/**'
      - 'scripts/run_biocircuit_bc00.py'
      - 'tests_biocircuit/**'
      - '.github/workflows/biocircuit-bc00.yml'
      - 'research/BIOCIRCUIT_BC00_README.md'
      - 'results/biocircuit/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bc00:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Run deterministic synthetic unit tests
        run: python -m unittest discover -s tests_biocircuit -v
      - name: Run actual matched 4096-neuron prototype
        run: python scripts/run_biocircuit_bc00.py --neurons 4096 --items 128 --epochs 4 --seeds 31,37,43 --output results/biocircuit/BC00.json
      - name: Preserve machine-readable experiment results
        uses: actions/upload-artifact@v4
        with:
          name: biocircuit-bc00-matched-4096
          path: results/biocircuit/BC00.json
          if-no-files-found: error
          retention-days: 90
