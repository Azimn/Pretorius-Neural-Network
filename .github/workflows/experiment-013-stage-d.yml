name: Experiment 013 Stage D cross-topology delta graft

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/experiment_013_stage_d.py'
      - 'experiments/experiment_013_stage_c.py'
      - 'experiments/experiment_013_cross_topology.py'
      - 'tests/test_experiment_013_stage_d.py'
      - 'tests/test_experiment_013_stage_c.py'
      - 'tests/test_experiment_013_alignment.py'
      - '.github/workflows/experiment-013-stage-d.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  stage-d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Preflight imports, public splits, module resolution, protocol constants, and artifact contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: |
          python - <<'PY'
          import numpy, scipy
          import persona_net
          import experiment_013_cross_topology
          import experiment_013_stage_c
          import experiment_013_stage_d as d
          from pathlib import Path
          from persona_net.v04_data import load_v04_split
          root = Path.cwd() / 'data' / 'v0_4'
          expected = {'train': 100, 'validation': 40, 'adversarial': 20}
          actual = {name: len(load_v04_split(root, name)) for name in expected}
          assert actual == expected, (actual, expected)
          assert d.SEEDS == (1842, 101, 202, 303, 404, 505), d.SEEDS
          assert d.CYCLIC_PAIRS == ((1842,101),(101,202),(202,303),(303,404),(404,505),(505,1842)), d.CYCLIC_PAIRS
          assert d.CORE_FRACTION == 0.01
          expected_report = Path('results/experiment_013_cross_topology/stage_d_n1024_steps24000.json')
          assert expected_report.name == 'stage_d_n1024_steps24000.json'
          print('preflight ok', actual, 'numpy', numpy.__version__, 'scipy', scipy.__version__)
          PY
      - name: Stage B C D unit preflights
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python -m pytest -q tests/test_experiment_013_alignment.py tests/test_experiment_013_stage_c.py tests/test_experiment_013_stage_d.py
      - name: Run preregistered Stage D
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/experiments
        run: python experiments/experiment_013_stage_d.py --neurons 1024 --training-neural-steps 24000
      - name: Verify expected immutable report path
        if: always()
        run: test -f results/experiment_013_cross_topology/stage_d_n1024_steps24000.json
      - name: Upload immutable Stage D report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-013-stage-d-${{ github.sha }}
          path: results/experiment_013_cross_topology/stage_d_n1024_steps24000.json
          if-no-files-found: error
          retention-days: 90
