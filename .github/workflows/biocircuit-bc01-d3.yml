name: BioCircuit BC01 D3 recurrent credit assignment
on:
  push:
    paths:
      - "biocircuit/bc01_d3.py"
      - "scripts/run_biocircuit_bc01_d3.py"
      - "tests_biocircuit/test_bc01_d3.py"
      - ".github/workflows/biocircuit-bc01-d3.yml"
  pull_request:
    paths:
      - "biocircuit/bc01_d3.py"
      - "scripts/run_biocircuit_bc01_d3.py"
      - "tests_biocircuit/test_bc01_d3.py"
      - ".github/workflows/biocircuit-bc01-d3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-verified-development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2"
      - name: Exact shared memory provider and immutable source
        uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: 7cd631f3b533203e39465ec31c4ee42945610e2f
          path: upstream-connectome
      - name: Regression tests including all prior BC01 baselines
        run: python -m unittest discover -s tests_biocircuit -v
      - name: Build existing L2 feature caches once per independent training split
        run: |
          for seed in 31 37 43; do
            python upstream-connectome/scripts/build_shared_memory_l2.py --seed "$seed" --output-dir "data/derived/shared-l2-cache/seed$seed" --report "results/biocircuit/d3-cache-$seed.json"
          done
      - name: Nine shared-input controlled recurrent diagnostics
        run: |
          python scripts/run_biocircuit_bc01_d3.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --cache-root data/derived/shared-l2-cache --connectome-root upstream-connectome --neurons 256 --seeds 31,37,43 --modes local,global,generic --eta 0.03 --gain 1 --checkpoint-dir results/biocircuit/d3_checkpoints --output results/biocircuit/BC01_D3.json
          python -c 'import json; r=json.load(open("results/biocircuit/BC01_D3.json")); assert len(r["trials"])==9 and r["source_events"]==450; assert all(x["checkpoint_restart_exact"] for x in r["trials"]); assert all(x["shared_feature_manifest_sha256"] for x in r["trials"])'
      - name: Repeat full experiment in fresh Python process and require exact identity
        run: |
          python scripts/run_biocircuit_bc01_d3.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --cache-root data/derived/shared-l2-cache --connectome-root upstream-connectome --neurons 256 --seeds 31,37,43 --modes local,global,generic --eta 0.03 --gain 1 --output results/biocircuit/BC01_D3_REPEAT.json
          python -c 'import json; a=json.load(open("results/biocircuit/BC01_D3.json")); b=json.load(open("results/biocircuit/BC01_D3_REPEAT.json")); assert a["trials"]==b["trials"], "Source-verified neural D3 replay drift"'
      - name: Historical encoder check without shared preprocessing
        run: |
          python scripts/run_biocircuit_bc01_d3.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --neurons 256 --seeds 31 --modes local --eta 0.03 --output results/biocircuit/BC01_D3_LEGACY.json
      - name: Commit complete D3 per-case evidence to research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bc01-d3-credit-diagnostics'
        run: |
          cp results/biocircuit/BC01_D3.json results/biocircuit/BC01_D3_FULL_PER_CASE.json
          cp results/biocircuit/BC01_D3_LEGACY.json results/biocircuit/BC01_D3_LEGACY_PER_CASE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/biocircuit/BC01_D3_FULL_PER_CASE.json results/biocircuit/BC01_D3_LEGACY_PER_CASE.json
          git commit -m "Archive measured D3 source-grounded raw per-case traces (CI run ${{ github.run_id }})"
          git push origin HEAD:refs/heads/feature/bc01-d3-credit-diagnostics
      - name: Archive complete neural traces and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biocircuit-bc01-d3-recurrent-diagnostics
          path: |
            results/biocircuit/BC01_D3.json
            results/biocircuit/BC01_D3_LEGACY.json
            results/biocircuit/BC01_D3_REPEAT.json
            results/biocircuit/d3-cache-*.json
            results/biocircuit/d3_checkpoints/
          retention-days: 30
          if-no-files-found: warn
