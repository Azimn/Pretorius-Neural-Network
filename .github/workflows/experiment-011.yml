name: experiment-011

on:
  push:
    branches: [v0.4-core-necessity]
    paths:
      - 'experiments/experiment_011_core_necessity.py'
      - 'experiments/experiment_010_minimal_transferable_core.py'
      - 'persona_net/**'
      - 'data/v0_4/**'
      - 'config/default.json'
      - '.github/workflows/experiment-011.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run three-seed core necessity experiment
        env:
          PYTHONPATH: .
        run: python experiments/experiment_011_core_necessity.py
      - name: Upload immutable report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-011-report-${{ github.sha }}
          path: results/experiment_011_core_necessity/report_n1024_steps24000.json
          if-no-files-found: error
