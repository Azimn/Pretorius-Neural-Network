name: Chimera 001 mechanical checks
on:
  pull_request:
    paths:
      - 'scripts/run_chimera_001.py'
      - 'config/chimera_001.json'
      - 'tests_chimera/**'
      - '.github/workflows/chimera-001-tests.yml'
  push:
    paths:
      - 'scripts/run_chimera_001.py'
      - 'config/chimera_001.json'
      - 'tests_chimera/**'
      - '.github/workflows/chimera-001-tests.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Test exact graft and frozen decoder mechanics
        run: python -m unittest discover -s tests_chimera -v
      - name: Verify source-gated preflight refuses absent v1 battery
        shell: bash
        run: |
          set +e
          python scripts/run_chimera_001.py --preflight-only
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/chimera_001/STATUS.json')
          status = json.loads(p.read_text())
          assert status['status'] == 'blocked_preflight'
          assert status['terminal_battery_touched'] is False
          assert status['claim_status'] == 'not_reproduced'
          print('Preflight correctly blocked; no numeric outcomes fabricated')
          PY
