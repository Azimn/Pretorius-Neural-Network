name: BioCircuit BC01 D5 synaptic credit localization
on:
  push:
    paths:
      - "biocircuit/bc01_d4.py"
      - "biocircuit/bc01_d5.py"
      - "scripts/run_biocircuit_bc01_d5.py"
      - "tests_biocircuit/test_bc01_d5.py"
      - ".github/workflows/biocircuit-bc01-d5.yml"
  pull_request:
    paths:
      - "biocircuit/bc01_d4.py"
      - "biocircuit/bc01_d5.py"
      - "scripts/run_biocircuit_bc01_d5.py"
      - "tests_biocircuit/test_bc01_d5.py"
      - ".github/workflows/biocircuit-bc01-d5.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recurrent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "17"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-range CPU dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "scikit-learn>=1.5,<2"
      - name: Checkout immutable source and deterministic L2 v2 provider
        uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: 7cd631f3b533203e39465ec31c4ee42945610e2f
          path: upstream-connectome
      - name: Run all BioCircuit regressions and D5 untouched-baseline controls
        run: python -m unittest discover -s tests_biocircuit -v
      - name: Build source-verified train-only L2 v2 seeds
        run: |
          for seed in 31 37 43; do
            python upstream-connectome/scripts/build_shared_memory_l2.py --seed "$seed" --output-dir "data/derived/shared-l2-cache/seed$seed" --report "results/biocircuit/d5-l2-$seed.json"
          done
      - name: D5 independent baseline matched 18 condition audit
        run: |
          python scripts/run_biocircuit_bc01_d5.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --cache-root data/derived/shared-l2-cache --connectome-root upstream-connectome --seeds 31,37,43 --modes local,global,generic --gains 1,12 --checkpoint-dir results/biocircuit/d5_checkpoints --output results/biocircuit/BC01_D5.json
          python - <<'PY'
          import json
          r=json.load(open("results/biocircuit/BC01_D5.json"))
          assert len(r["trials"])==18 and r["source_events"]==450 and r["source_card_count"]==16
          assert all(t["checkpoint_restart_exact"] for t in r["trials"])
          assert all(len(t["training_event_traces"])==48 for t in r["trials"])
          assert all(len(t["query_counterfactual_traces"])==16 for t in r["trials"])
          PY
      - name: Independently repeat under different process hash salt
        run: |
          PYTHONHASHSEED=71337 python scripts/run_biocircuit_bc01_d5.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --cache-root data/derived/shared-l2-cache --connectome-root upstream-connectome --seeds 31,37,43 --modes local,global,generic --gains 1,12 --checkpoint-dir results/biocircuit/d5_repeat_checkpoints --output results/biocircuit/BC01_D5_REPEAT.json
          python - <<'PY'
          import json
          a=json.load(open("results/biocircuit/BC01_D5.json"))
          b=json.load(open("results/biocircuit/BC01_D5_REPEAT.json"))
          for r in (a,b):
            for x in r["trials"]:
              x.pop("elapsed_seconds_observed")
          assert a==b, "D5 neural telemetry differs between independent processes"
          print("D5 exact 18-trial independent numerical replay succeeded")
          PY
      - name: Commit full measured audit to source branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bc01-d5-credit-localization'
        run: |
          cp results/biocircuit/BC01_D5.json results/biocircuit/BC01_D5_FULL_PER_CASE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/biocircuit/BC01_D5_FULL_PER_CASE.json
          git commit -m "Archive measured D5 recurrent local credit traces run ${{ github.run_id }}"
          git fetch origin feature/bc01-d5-credit-localization
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/feature/bc01-d5-credit-localization
      - name: Upload raw outputs and neural checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biocircuit-bc01-d5-credit-audit
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/biocircuit/BC01_D5.json
            results/biocircuit/BC01_D5_REPEAT.json
            results/biocircuit/d5-l2-*.json
            results/biocircuit/d5_checkpoints/
