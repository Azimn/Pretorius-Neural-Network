name: BioCircuit BC01 exploratory Pretorius
on:
  push:
    paths:
      - "biocircuit/bc01.py"
      - "scripts/demo_biocircuit_bc01.py"
      - "resources/biocircuit/**"
      - "tests_biocircuit/**"
      - "persona_net/**"
      - ".github/workflows/biocircuit-bc01.yml"
  pull_request:
    paths:
      - "biocircuit/bc01.py"
      - "scripts/demo_biocircuit_bc01.py"
      - "resources/biocircuit/**"
      - "tests_biocircuit/**"
      - "persona_net/**"
      - ".github/workflows/biocircuit-bc01.yml"
  workflow_dispatch:

jobs:
  bc01-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2"
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: feature/shared-memory-v1
          # This commit contains immutable L1 manifest + archive; L0 blob remains pinned in BC01.
          path: upstream-connectome
      - name: Assert source of shared L1 is present
        run: |
          test -f upstream-connectome/artifacts/shared_memory/v1/manifest.json
          test -f upstream-connectome/artifacts/shared_memory/v1/pretorius_l1_v1.jsonl.gz
      - name: Add exact BC01 lexical L2 to existing published L1
        run: python upstream-connectome/scripts/export_shared_memory.py --output upstream-connectome/artifacts/shared_memory/v1
      - name: Validate replayed cached BC01 L2
        run: python upstream-connectome/scripts/export_shared_memory.py --output upstream-connectome/artifacts/shared_memory/v1 --validate-only
      - name: Run BC00 and BC01 unit tests
        run: python -m unittest discover -s tests_biocircuit -v
      - name: Run source-grounded demo
        run: |
          python scripts/demo_biocircuit_bc01.py --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_preview.json --checkpoint results/biocircuit/BC01_preview.npz
          python -c 'import json; x=json.load(open("results/biocircuit/BC01_preview.json")); assert len(x["tests"]) == 3; assert all(v["checkpoint_restart_exact"] for v in x["tests"])'
      - name: Validate and run pinned 450-memory original
        run: |
          python scripts/demo_biocircuit_bc01.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_full_450_preview.json --checkpoint results/biocircuit/BC01_full_450_preview.npz
          python -c 'import json; x=json.load(open("results/biocircuit/BC01_full_450_preview.json")); assert x["corpus_events"] == 450; assert x["corpus_kind"] == "full"; assert all(v["checkpoint_restart_exact"] for v in x["tests"]); assert x["tests"][2]["retrieval"]["candidate"] is None'
      - name: Prove BC01 can consume identical portable 450-memory records
        run: |
          python scripts/demo_biocircuit_bc01.py --shared-l1 upstream-connectome/artifacts/shared_memory/v1/pretorius_l1_v1.jsonl.gz --shared-manifest upstream-connectome/artifacts/shared_memory/v1/manifest.json --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_shared_L1_preview.json --checkpoint results/biocircuit/BC01_shared_L1_preview.npz
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("results/biocircuit/BC01_full_450_preview.json").read_text())
          b = json.loads(Path("results/biocircuit/BC01_shared_L1_preview.json").read_text())
          assert a["corpus_events"] == b["corpus_events"] == 450
          assert a["corpus_kind"] == b["corpus_kind"] == "full"
          assert a["tests"] == b["tests"], "Same seed and source must yield identical BC01 evaluation"
          print("BC01 original-L0 and portable-L1 tests match exactly")
          PY
      - name: Prove canonical BC01 L2 preserves full 450 event neurobehavior
        run: |
          python scripts/demo_biocircuit_bc01.py --shared-dir upstream-connectome/artifacts/shared_memory/v1 --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_shared_L2_preview.json --checkpoint results/biocircuit/BC01_shared_L2_preview.npz
          python -c 'import json; a=json.load(open("results/biocircuit/BC01_full_450_preview.json")); b=json.load(open("results/biocircuit/BC01_shared_L2_preview.json")); assert a["tests"]==b["tests"]; assert a["recurrent_changed_synapses"]==b["recurrent_changed_synapses"]; assert b["shared_cached_source"]; print("PASS: 450 source features and all BC01 decisions/restart checks match exactly")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biocircuit-bc01-preview
          path: |
            results/biocircuit/BC01_preview.json
            results/biocircuit/BC01_preview.npz
            results/biocircuit/BC01_preview.bc01.json
            results/biocircuit/BC01_full_450_preview.json
            results/biocircuit/BC01_full_450_preview.npz
            results/biocircuit/BC01_full_450_preview.bc01.json
            results/biocircuit/BC01_shared_L1_preview.json
            results/biocircuit/BC01_shared_L1_preview.npz
            results/biocircuit/BC01_shared_L1_preview.bc01.json
            results/biocircuit/BC01_shared_L2_preview.json
            results/biocircuit/BC01_shared_L2_preview.npz
            results/biocircuit/BC01_shared_L2_preview.bc01.json
            upstream-connectome/artifacts/shared_memory/v1/bc01_l2_manifest.json
          if-no-files-found: warn
          retention-days: 30
