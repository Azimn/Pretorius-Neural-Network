name: BioCircuit BC01 exploratory Pretorius
on:
  push:
    paths:
      - "biocircuit/bc01.py"
      - "scripts/demo_biocircuit_bc01.py"
      - "resources/biocircuit/**"
      - "tests_biocircuit/**"
      - "persona_net/**"
      - ".github/workflows/biocircuit-bc01.yml"
  pull_request:
    paths:
      - "biocircuit/bc01.py"
      - "scripts/demo_biocircuit_bc01.py"
      - "resources/biocircuit/**"
      - "tests_biocircuit/**"
      - "persona_net/**"
      - ".github/workflows/biocircuit-bc01.yml"
  workflow_dispatch:

jobs:
  bc01-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2"
      - uses: actions/checkout@v4
        with:
          repository: Azimn/Pretorius-Connectome
          ref: feature/shared-memory-v1
          path: upstream-connectome
      - name: Export verified canonical L1/BC01 L2 once
        run: python upstream-connectome/scripts/export_shared_memory.py --output results/shared_memory/v1
      - name: Validate cached artifact replay
        run: python upstream-connectome/scripts/export_shared_memory.py --output results/shared_memory/v1 --validate-only
      - name: Run BC00 and BC01 unit tests
        run: python -m unittest discover -s tests_biocircuit -v
      - name: Run source-grounded demo
        run: |
          python scripts/demo_biocircuit_bc01.py --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_preview.json --checkpoint results/biocircuit/BC01_preview.npz
          python -c 'import json; x=json.load(open("results/biocircuit/BC01_preview.json")); assert len(x["tests"]) == 3; assert all(v["checkpoint_restart_exact"] for v in x["tests"])'
      - name: Validate and run pinned 450-memory original
        run: |
          python scripts/demo_biocircuit_bc01.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_full_450_preview.json --checkpoint results/biocircuit/BC01_full_450_preview.npz
          python -c 'import json; x=json.load(open("results/biocircuit/BC01_full_450_preview.json")); assert x["corpus_events"] == 450; assert x["corpus_kind"] == "full"; assert all(v["checkpoint_restart_exact"] for v in x["tests"]); assert x["tests"][2]["retrieval"]["candidate"] is None'
      - name: Run full BC01 using SAME cached canonical sensory input
        run: |
          python scripts/demo_biocircuit_bc01.py --corpus upstream-connectome/memories/current/Pretorius_v12_450_Events_Complete.jsonl --shared-dir results/shared_memory/v1 --neurons 256 --seed 1842 --exposures 8 --output results/biocircuit/BC01_cached_full_450.json --checkpoint results/biocircuit/BC01_cached_full_450.npz
          python -c 'import json; a=json.load(open("results/biocircuit/BC01_full_450_preview.json")); b=json.load(open("results/biocircuit/BC01_cached_full_450.json")); assert a["tests"] == b["tests"]; assert a["recurrent_changed_synapses"] == b["recurrent_changed_synapses"]; assert b["shared_cached_source"]; print("EXACT BC01 FULL SOURCE VECTORS AND OUTPUTS MATCH")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biocircuit-bc01-preview
          path: |
            results/biocircuit/BC01_preview.json
            results/biocircuit/BC01_preview.npz
            results/biocircuit/BC01_preview.bc01.json
            results/biocircuit/BC01_full_450_preview.json
            results/biocircuit/BC01_full_450_preview.npz
            results/biocircuit/BC01_full_450_preview.bc01.json
            results/biocircuit/BC01_cached_full_450.json
            results/biocircuit/BC01_cached_full_450.npz
            results/biocircuit/BC01_cached_full_450.bc01.json
            results/shared_memory/v1/manifest.json
          if-no-files-found: warn
          retention-days: 30
